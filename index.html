<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand Landmark Detection</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { margin-bottom: 16px; }
    .container {
      position: relative;
      display: inline-block;
    }
    video {
      display: none;
    }
    #drawCanvas {
      display: none;
    }
    canvas {
      display: block;
      border-radius: 8px;
      background: #000;
      transform: scaleX(-1);
    }
    button {
      margin-top: 16px;
      padding: 10px 24px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #8B5CF6;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #7C3AED; }
    #status { margin-top: 12px; color: #aaa; }
  </style>
</head>
<body>
  <h1>✋ Hand Landmark Detection</h1>
  <div class="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="drawCanvas"></canvas>
    <canvas id="canvas"></canvas>
  </div>
  <div style="margin-top:16px; display:flex; gap:10px;">
    <button id="startBtn" type="button">카메라 시작</button>
    <button id="clearBtn" type="button" style="background:#EF4444;">지우기</button>
  </div>
  <p id="status">버튼을 눌러 카메라를 시작하세요</p>
  <p id="gesture" style="margin-top:8px; color:#8B5CF6; font-size:18px; font-weight:bold;"></p>

  <script type="module">
    import { HandLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const drawCanvas = document.getElementById("drawCanvas");
    const drawCtx = drawCanvas.getContext("2d");
    const startBtn = document.getElementById("startBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusEl = document.getElementById("status");
    const gestureEl = document.getElementById("gesture");

    let handLandmarker = null;
    let running = false;

    // Drawing state
    let isDrawing = false;
    let lastPoint = null;

    // Gesture detection: check if a finger is extended
    // Compare fingertip y with finger PIP joint y (in screen coords, lower y = higher)
    function isFingerExtended(landmarks, tipIdx, pipIdx) {
      return landmarks[tipIdx].y < landmarks[pipIdx].y;
    }

    function isThumbExtended(landmarks) {
      // Thumb: compare tip x distance from wrist vs ip x distance
      const tipX = landmarks[4].x;
      const ipX = landmarks[3].x;
      const wristX = landmarks[0].x;
      return Math.abs(tipX - wristX) > Math.abs(ipX - wristX);
    }

    function detectGesture(landmarks) {
      const indexExtended = isFingerExtended(landmarks, 8, 6);
      const middleExtended = isFingerExtended(landmarks, 12, 10);
      const ringExtended = isFingerExtended(landmarks, 16, 14);
      const pinkyExtended = isFingerExtended(landmarks, 20, 18);

      // Pointing up: only index finger extended
      if (indexExtended && !middleExtended && !ringExtended && !pinkyExtended) {
        return "pointing";
      }

      // Fist: no fingers extended
      if (!indexExtended && !middleExtended && !ringExtended && !pinkyExtended) {
        return "fist";
      }

      return "other";
    }

    async function init() {
      statusEl.textContent = "모델 로딩 중...";
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 1
      });
      statusEl.textContent = "모델 준비 완료!";
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        await video.play();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        drawCanvas.width = video.videoWidth;
        drawCanvas.height = video.videoHeight;
        running = true;
        startBtn.textContent = "카메라 정지";
        statusEl.textContent = "☝️ 검지를 펴면 그리기, ✊ 주먹을 쥐면 멈춤";
        detect();
      } catch (e) {
        statusEl.textContent = "카메라 접근 실패: " + e.message;
      }
    }

    function stopCamera() {
      running = false;
      const stream = video.srcObject;
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
      }
      video.srcObject = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      startBtn.textContent = "카메라 시작";
      statusEl.textContent = "카메라 정지됨";
      gestureEl.textContent = "";
      lastPoint = null;
      isDrawing = false;
    }

    function detect() {
      if (!running) return;
      const result = handLandmarker.detectForVideo(video, performance.now());

      // Clear landmark canvas each frame (drawing canvas persists)
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw the persistent sketch lines from drawCanvas onto the landmark canvas
      ctx.drawImage(drawCanvas, 0, 0);

      const drawingUtils = new DrawingUtils(ctx);
      if (result.landmarks && result.landmarks.length > 0) {
        const landmarks = result.landmarks[0];

        // Draw hand skeleton
        drawingUtils.drawConnectors(landmarks, HandLandmarker.HAND_CONNECTIONS, {
          color: "#00FF88", lineWidth: 3
        });
        drawingUtils.drawLandmarks(landmarks, {
          color: "#FF4488", lineWidth: 1, radius: 4
        });

        // Detect gesture
        const gesture = detectGesture(landmarks);

        if (gesture === "pointing") {
          gestureEl.textContent = "☝️ 그리는 중...";
          gestureEl.style.color = "#EF4444";

          // Get index finger tip position (landmark 8)
          const tipX = landmarks[8].x * canvas.width;
          const tipY = landmarks[8].y * canvas.height;

          if (isDrawing && lastPoint) {
            // Draw red line on the persistent draw canvas
            drawCtx.strokeStyle = "#EF4444";
            drawCtx.lineWidth = 20;
            drawCtx.lineCap = "round";
            drawCtx.lineJoin = "round";
            drawCtx.beginPath();
            drawCtx.moveTo(lastPoint.x, lastPoint.y);
            drawCtx.lineTo(tipX, tipY);
            drawCtx.stroke();
          }

          isDrawing = true;
          lastPoint = { x: tipX, y: tipY };
        } else if (gesture === "fist") {
          gestureEl.textContent = "✊ 지우기";
          gestureEl.style.color = "#8B5CF6";
          drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
          isDrawing = false;
          lastPoint = null;
        } else {
          gestureEl.textContent = "✋ 대기";
          gestureEl.style.color = "#6B7280";
          isDrawing = false;
          lastPoint = null;
        }
      } else {
        gestureEl.textContent = "";
        isDrawing = false;
        lastPoint = null;
      }

      requestAnimationFrame(detect);
    }

    startBtn.addEventListener("click", () => {
      if (running) {
        stopCamera();
      } else {
        startCamera();
      }
    });

    clearBtn.addEventListener("click", () => {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      lastPoint = null;
      isDrawing = false;
    });

    init();
  </script>
</body>
</html>
